{{define "alert"}}
{{if .Flash}}
<div class="alert-container">
    <div class="alert alert-{{.FlashType}} alert-animated"
         x-data="flashAlert"
         x-show="show"
         :class="{ 'alert-dismissing': dismissing }"
         @mouseenter="setProgressState('paused')"
         @mouseleave="setProgressState('running')">
        <span class="alert-message">{{.Flash}}</span>
        <button type="button" class="alert-close" @click="dismiss()" aria-label="{{T .AdminLang "btn.close"}}">&times;</button>
        <div class="alert-progress" :style="'animation-duration: ' + autoDismissTime + 'ms'"></div>
    </div>
</div>
{{end}}
{{end}}
