{{define "base"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="generator" content="oCMS - https://ocms.tech">
    <title>{{if .Title}}{{.Title}} - {{end}}oCMS</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/static/dist/main.css">
    {{block "head" .}}{{end}}
</head>
<body>
    {{block "body" .}}{{end}}

    <!-- HTMX (vendored with SRI; htmx 2 error semantics: never swap 4xx/5xx response bodies) -->
    <meta name="htmx-config" content='{"noSwap": [204, 304, "4xx", "5xx"]}'>
    <script nonce="{{.CSPNonce}}" src="{{ scriptURL "/static/dist/js/htmx.min.js" }}" integrity="sha384-BvJpBiO8Kh31EqtJe5DRIeWrHWnCGkwytKs9NKFi86Hhw96dEqdEMzZDeK9iEGTc" crossorigin="anonymous"></script>
    <!-- Alpine.js Sort Plugin (must load before Alpine) -->
    <script nonce="{{.CSPNonce}}" defer src="{{ scriptURL "/static/dist/js/alpine-sort.min.js" }}" integrity="sha384-hqiYD2WaUm+VsLVKEqRzzkJ7HQownCb0Mjq/GQJUDyzwA+vztNBwFqsWkbRGZCv+" crossorigin="anonymous"></script>
    <!-- Alpine.js -->
    <script nonce="{{.CSPNonce}}" defer src="{{ scriptURL "/static/dist/js/alpine.min.js" }}" integrity="sha384-5/joNqFnRyVWzXp99bHot6RHG+EksGp+USSgZwPar7T9SD9PKKER37n/8bXBAZGd" crossorigin="anonymous"></script>

    <!-- Admin core utilities: keyboard shortcuts, HTMX handlers, toast notifications, form validation -->
    <script nonce="{{.CSPNonce}}" src="/static/dist/js/admin-core.js"></script>
    <!-- Unified media dropzone component for Alpine.js (select + upload modes) -->
    <script nonce="{{.CSPNonce}}" src="/static/dist/js/media-dropzone.js"></script>
    {{block "scripts" .}}{{end}}
</body>
</html>
{{end}}
